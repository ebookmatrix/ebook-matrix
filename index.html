
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebook Matrix | Digital Books</title>
  <meta name="description" content="Discover useful digital ebooks, guides and resources at Ebook Matrix.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #171717;
    }
    header {
      padding: 22px 7%;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 24px;
    }
    header span { color: #ffd43b; }
    main {
      max-width: 900px;
      margin: auto;
      padding: 75px 24px;
      text-align: center;
    }
    .tag {
      color: #806300;
      font-weight: bold;
      letter-spacing: 1px;
    }
    h1 { font-size: clamp(36px, 6vw, 60px); margin: 18px 0; }
    p { color: #555; line-height: 1.7; }
    .btn {
      display: inline-block;
      background: #ffd43b;
      color: #111;
      padding: 15px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 18px;
    }
    footer { text-align: center; padding: 24px; color: #666; }
  </style>
</head>
<body>
  <header>Ebook <span>Matrix</span></header>
  <main>
    <div class="tag">LEARN • GROW • IMPROVE</div>
    <h1>Knowledge that moves you forward.</h1>
    <p>Explore practical ebooks and digital guides designed to help you learn new skills and achieve your goals.</p>
    <a class="btn" href="#ebooks">Explore Ebooks</a>
    <section id="ebooks">
      <h2>Our Digital Library</h2>
      <p>New ebooks and useful resources are coming soon.</p>
    </section>
  </main>
  <footer>© 2026 Ebook Matrix</footer>
</body>
</html>
